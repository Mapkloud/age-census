services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agecensus
      POSTGRES_PASSWORD: agecensus
      POSTGRES_DB: agecensus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agecensus -d agecensus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
